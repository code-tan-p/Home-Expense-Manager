<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments :: header('')}"></header>
<main>
    <section class="card" style="max-width:26rem;margin:2rem auto">
        <h1>Sign in</h1>
        <p class="sub">Enter the household password.</p>
        <div class="flash error" th:if="${param.error}" role="alert">That password is not right. Please try again.</div>
        <div class="flash error" th:if="${param.locked}" role="alert">Too many wrong tries. Please wait 10 minutes and try again.</div>
        <div class="flash ok" th:if="${param.bye}" role="status">You are signed out.</div>
        <form th:action="@{/login}" method="post">
            <input type="hidden" name="username" value="household">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" autofocus required
                   style="margin-bottom:1rem">
            <button class="btn primary" type="submit">Sign in</button>
        </form>
    </section>
</main>
</body>
</html>
