<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Your recovery code')}"></head>
<body>
<header th:replace="~{fragments :: header('welcome')}"></header>
<main>
    <section class="card" style="max-width:30rem;margin:2rem auto">
        <h1 th:text="${reset} ? 'Password changed' : 'Welcome, ' + ${signedInName}">Welcome</h1>
        <p>Write down this recovery code and keep it safe. It is the <strong>only way</strong> to get back in if you forget your
            password. It is shown just once.</p>
        <p class="total" style="font-size:1.6rem;letter-spacing:.08em;text-align:center;margin:1rem 0" th:text="${recoveryCode}">ABCD-EFGH-JKLM-NPQR</p>
        <a class="btn primary" th:href="@{/}">I have saved it. Start</a>
    </section>
</main>
</body>
</html>
