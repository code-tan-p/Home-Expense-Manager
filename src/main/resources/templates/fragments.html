<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Home Expense Manager'">Home Expense Manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar" th:fragment="header(active)">
    <div class="topbar-inner">
        <div class="brand">Home Expense <span>Manager</span></div>
        <div class="userbar" th:if="${signedInName != null}">
            <a class="btn small-btn" th:href="@{/account}" th:classappend="${active == 'account'} ? 'active'"
               th:text="${signedInName}">Name</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn small-btn">Sign out</button>
            </form>
        </div>
        <nav aria-label="Main" th:if="${signedInName != null or active == 'overview' or active == 'today' or active == 'calendar' or active == 'staff' or active == 'pay' or active == 'reports' or active == 'backup' or active == 'account'}">
            <a th:href="@{/overview}" th:classappend="${active == 'overview'} ? 'active'">Overview</a>
            <a th:href="@{/}" th:classappend="${active == 'today'} ? 'active'">Today</a>
            <a th:href="@{/calendar}" th:classappend="${active == 'calendar'} ? 'active'">Calendar</a>
            <a th:href="@{/staff}" th:classappend="${active == 'staff'} ? 'active'">Staff</a>
            <a th:href="@{/pay}" th:classappend="${active == 'pay'} ? 'active'">Pay</a>
            <a th:href="@{/reports}" th:classappend="${active == 'reports'} ? 'active'">Reports</a>
            <a th:href="@{/backup}" th:classappend="${active == 'backup'} ? 'active'">Backup</a>
        </nav>
    </div>
</header>
<div th:fragment="messages">
    <div class="flash ok" th:if="${ok}" th:text="${ok}" role="status"></div>
    <div class="flash error" th:if="${error}" th:text="${error}" role="alert"></div>
</div>
</body>
</html>
