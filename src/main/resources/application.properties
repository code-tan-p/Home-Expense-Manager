spring.application.name=home-expense-manager

# Local-only web server: no login in version 1, so never listen on other interfaces.
server.address=127.0.0.1
server.port=8080

# Live database lives outside the Git repository, under the user's home directory.
# DataSourceConfig creates this directory on startup.
home-expense.data-dir=${user.home}/.home-expense-manager
spring.datasource.url=jdbc:sqlite:${home-expense.data-dir}/home-expense.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows a single writer; one pooled connection avoids "database is locked" errors.
# The data-source-properties are passed to the SQLite driver and applied as PRAGMAs on
# every new connection, which Flyway, Hibernate and the application all share.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.busy_timeout=5000

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.database-platform=com.homeexpense.config.HomeExpenseSQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
# The web pages read lazy fields (worker type, task and shift names) while rendering.
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
