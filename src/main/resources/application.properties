spring.application.name=home-expense-manager

# Where to listen. Use 0.0.0.0 only behind HTTPS (a reverse proxy or the hosting service).
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HOME_EXPENSE_SECURE_COOKIE:false}
server.servlet.session.timeout=8h
# Set HOME_EXPENSE_FORWARD_HEADERS=framework behind a reverse proxy so sign-in limits see each visitor, not the proxy.
server.forward-headers-strategy=${HOME_EXPENSE_FORWARD_HEADERS:none}
server.servlet.session.tracking-modes=cookie

# Every household has its own database file under <data-dir>/households/. Accounts live in <data-dir>/accounts.db.
home-expense.data-dir=${HOME_EXPENSE_DATA_DIR:${user.home}/.home-expense-manager}
home-expense.max-households=${HOME_EXPENSE_MAX_HOUSEHOLDS:500}
# SQLite is chosen per household (HouseholdDatabases): one connection each, WAL, busy timeout. No global datasource URL.
spring.flyway.enabled=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
management.health.db.enabled=false

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.database-platform=com.homeexpense.config.HomeExpenseSQLiteDialect
spring.jpa.hibernate.ddl-auto=none
# The web pages read lazy fields (worker type, task and shift names) while rendering.
spring.jpa.open-in-view=true


# Backups are whole databases.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Time zone used for "today" and month ends. Empty = this computer's zone. Example: Asia/Kolkata
home-expense.timezone=${HOME_EXPENSE_TIMEZONE:}

# Finish in-flight requests when the program is stopped.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s

# Never show stack traces or internal messages in the browser.
server.error.include-message=never
server.error.include-stacktrace=never

# Health check for Docker and hosting services. Nothing else is exposed.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Email (optional). Set these as server settings, never in code: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
home-expense.mail.from=${HOME_EXPENSE_MAIL_FROM:}
management.health.mail.enabled=false
