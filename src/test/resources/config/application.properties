# Test-only safety guard: loaded in addition to the main application.properties and
# takes precedence over it. Tests must never use the real household database under
# the user's home directory, so the data directory has no usable default here.
# Integration tests set home-expense.data-dir to a temporary folder (see
# SqliteIntegrationTest); any test that forgets to do so fails to start instead.
home-expense.data-dir=${home-expense.test-data-dir}
